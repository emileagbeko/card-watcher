# Cloud half of the watcher: runs the plain-HTTP targets on a schedule,
# commits their state, rebuilds the status page, deploys it to GitHub Pages.
# The browser-based topps-catalog target runs from the Mac (tools/run-local.sh);
# its state pushes land here via the push trigger, which rebuilds the page only.
name: watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['state/**']

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run light watches
        if: github.event_name != 'push'
        run: node watcher.js --targets asda-pokemon,asda-sports,topps-now
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit state
        if: github.event_name != 'push'
        run: |
          git config user.name "card-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "state: cloud run $(date -u '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Build status page
        run: node tools/build-page.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
